server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressao basica para os assets gerados pelo Vite
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA: qualquer rota que nao seja um arquivo existente cai no index.html
    # (necessario para o react-router-dom funcionar com navegacao direta/refresh)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para assets com hash no nome (gerados pelo build do Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
